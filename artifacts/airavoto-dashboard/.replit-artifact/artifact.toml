kind = "web"
previewPath = "/"
title = "Airavoto Gaming Launcher"
description = "A recreation of the Airavoto gaming launcher dashboard shown in the supplied reference, using the provided Windows wallpaper as its unchanged background."
version = "1.0.0"
id = "artifacts/airavoto-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20909

[services.development]
run = "pnpm --filter @workspace/airavoto-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airavoto-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/airavoto-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20909"
BASE_PATH = "/"
